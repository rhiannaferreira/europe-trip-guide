name: live-probe
on:
  push:
    branches: [live-data-checks]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch brand guidelines
        run: |
          mkdir -p out
          curl -sSL "https://tripadvisor.mediaroom.com/logo-guidelines" -o out/logo-guidelines.html || true
          curl -sSL "https://tripadvisor.mediaroom.com/download/2025+Tripadvisor+Brand+Guidelines+for+Partners.pdf" -o out/partner-guidelines.pdf || true
          ls -la out
          sudo apt-get install -y poppler-utils >/dev/null 2>&1 || true
          pdftotext -layout out/partner-guidelines.pdf out/partner-guidelines.txt || true
          python3 -c "import re,html;s=open('out/logo-guidelines.html',errors='ignore').read();s=re.sub(r'(?s)<(script|style).*?</\\1>','',s);s=html.unescape(re.sub(r'<[^>]+>','\\n',s));open('out/logo-guidelines.txt','w').write(re.sub(r'\\n\\s*\\n+','\\n',s))"
      - name: Save to branch terra-docs
        run: |
          git config user.name probe && git config user.email probe@example.invalid
          git checkout --orphan terra-docs2 && git rm -rfq . && mv out terra && git add terra && git commit -qm docs && git push -f origin terra-docs2
