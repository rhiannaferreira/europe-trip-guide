<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" />
    <title>Eurowander</title>
    <meta name="description" content="Plan a trip across Europe: browse cities and places by interest, build a day-by-day itinerary, and map your route." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1f4e79" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eurowander" />
    <meta property="og:title" content="Eurowander" />
    <meta property="og:description" content="Plan a trip across Europe: browse cities and places by interest, build a day-by-day itinerary, and map your route." />
    <meta property="og:type" content="website" />
    <script>
      // Apply a saved light/dark choice before the page draws, so it doesn't flash the other theme.
      try {
        var t = localStorage.getItem('travel-app-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
